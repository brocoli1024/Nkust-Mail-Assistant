services:
  - type: web
    name: nkust-mail-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: sh scripts/start-web.sh
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true

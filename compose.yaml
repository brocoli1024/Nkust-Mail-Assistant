name: nkust-demo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: synthetic-demo-only
      POSTGRES_DB: nkust_demo
    # No host port or persistent volume: disposable, synthetic data only.
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U demo -d nkust_demo"]
      interval: 2s
      timeout: 2s
      retries: 30
  web:
    build: .
    environment:
      DEMO_MODE: '1'
      DATABASE_URL: postgresql+psycopg://demo:synthetic-demo-only@db:5432/nkust_demo
      APP_BASE_URL: http://localhost:8000
      MONITORING_TOKEN: synthetic-demo-monitoring-token-32-characters
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20

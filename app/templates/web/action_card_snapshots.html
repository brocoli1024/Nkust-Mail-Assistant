<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>我的原快照歷史</title><link rel="stylesheet" href="/assets/account.css?v=action-card-1"></head><body><div class="site-shell">{% include 'site_header.html' %}<main id="main-content" class="page-content"><h1>此封郵件的全部原快照</h1><section class="detail-card">{% for h in data.snapshots %}<p><a class="text-link dark" href="/action-cards/history/{{ h.id }}">{{ h.title }}（修正版本 {{ h.revision }}）</a></p>{% else %}<p>尚無修正紀錄。</p>{% endfor %}{% if data.page_number>1 %}<a class="button secondary" href="?page={{ data.page_number-1 }}">上一頁</a>{% endif %}{% if data.has_more %}<a class="button secondary" href="?page={{ data.page_number+1 }}">下一頁</a>{% endif %}</section><a class="text-link" href="/announcements/{{ data.announcement_id }}">返回公告</a></main></div></body></html>

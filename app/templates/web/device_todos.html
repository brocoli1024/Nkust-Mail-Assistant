<section class="detail-card device-todo-panel" data-todo-list data-scope="public" aria-label="我的待辦與即將截止">
  <header class="device-todo-heading">
    <div><p class="eyebrow">MY TASKS</p><h2>我的待辦</h2></div>
    <span class="device-todo-badge">此裝置</span>
  </header>
  <p class="device-todo-intro">把想處理的公告加入待辦，在這裡追蹤進度與期限。</p>
  <p class="device-todo-privacy">僅存於此瀏覽器；共用裝置可能看見，清除瀏覽器資料會遺失。</p>
  <div class="device-todo-toolbar">
    <label>查看狀態 <select data-todo-filter><option value="active">進行中與即將截止</option><option value="snoozed">稍後處理</option><option value="done">已完成</option></select></label>
    <a class="button" href="/public/announcements">找公告加入待辦</a>
  </div>
  <p class="device-todo-status" data-todo-status role="status" aria-live="polite">正在讀取此裝置待辦。</p>
  <div class="device-todo-items" data-todo-items></div>
  <details class="device-todo-help">
    <summary>保存與提醒說明</summary>
    <p>免登入、只存於此瀏覽器；私人 Gmail 待辦另依帳號保存，不會自動匯入，也不會隨 Google 帳號切換。</p>
    <p>到公告詳情核對行動與期限，再按「加入我的待辦」。未知日期不列為確定截止；加入不表示符合資格。</p>
    <p>到期重新開頁，或開著頁面每分鐘重新計算後，稍後項目會回到進行中；沒有推播通知。</p>
  </details>
  <noscript>裝置待辦需要 JavaScript；你仍可免登入瀏覽公告與原文。</noscript>
</section>

name: Update public announcements
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      announcement_id:
        description: Optional public announcement ID to recheck (blank for regular batch)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: public-announcement-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-deployment
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-web.txt
      - name: Sync official public feed
        env:
          DATABASE_URL: ${{ secrets.NKUST_PUBLIC_SYNC_DATABASE_URL }}
          NKUST_PUBLIC_ANNOUNCEMENT_ID: ${{ inputs.announcement_id }}
        run: |
          python -m app.public_cli sync --source nkust-latest
          if [ -n "$NKUST_PUBLIC_ANNOUNCEMENT_ID" ]; then
            python -m app.public_cli articles --limit 1 --announcement-id "$NKUST_PUBLIC_ANNOUNCEMENT_ID"
          else
            python -m app.public_cli articles --limit 8
          fi

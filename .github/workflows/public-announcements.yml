name: Update public announcements
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      announcement_id:
        description: Optional public announcement ID to recheck (blank for regular batch)
        required: false
        type: string
      office_url:
        description: Optional confirmed public MailView URL to import (blank refreshes known office announcements)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: public-announcement-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web-deployment
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-web.txt
      - name: Refresh independent public sources
        env:
          DATABASE_URL: ${{ secrets.NKUST_PUBLIC_SYNC_DATABASE_URL }}
          NKUST_PUBLIC_ANNOUNCEMENT_ID: ${{ inputs.announcement_id }}
          NKUST_PUBLIC_OFFICE_URL: ${{ inputs.office_url }}
        run: python scripts/refresh_public_sources.py
